; --------------------------------------------------------------------------
; 基础包固定项：打包产出的「引擎侧文件」——它们不是我们的素材，但启动就要用
;
; 为什么必须钉死在 chunk 0：
;   · ShaderArchive-* / ShaderTypeInfo-* 是 shader 库，游戏启动时就要打开它；
;     缺了在 Shipping 下可能直接起不来（不是「加载慢一点」的问题）
;   · PipelineCaches/*.upipelinecache 是管线缓存，跟着基础包走最省事
;   · Slate/* 是鼠标指针、logo 这类进游戏前就用的图标
; 放在兜底 A 之前，免得被「未分类 = 本次新增」那条网走。
; --------------------------------------------------------------------------
[CC_BaseArtifacts]
bOverrideChunkManifest=true
OverridePaks="pakchunk0"
bOnlyChunkedBuilds=true
+Files=".../CrossingVoid/Content/PipelineCaches/..."
+Files=".../CrossingVoid/Content/ShaderArchive-*"
+Files=".../CrossingVoid/Content/ShaderTypeInfo-*"
+Files=".../CrossingVoid/Content/Slate/..."

; --------------------------------------------------------------------------
; 兜底 A：本工程 Content 里「没有规则认领」的文件 = 本次新增内容
;        → pakchunk8（一次常规补丁的载体）
;
; 为什么不是 chunk 0：规则里没登记过的目录 = 这次新加的资源。
; 把它们单独成包，启动器就只需要下一个新包，基础包一点不动。
; 想让某批新资源自己成包，就在规则里给它标一个 chunk（右键文件夹即可）。
; （哪条规则网住了多少文件，看打包日志里的 `Pak rule ... with N matching files`）
; --------------------------------------------------------------------------
[CC_NewContent]
bOverrideChunkManifest=true
OverridePaks="pakchunk8"
bOnlyChunkedBuilds=true
+Files=".../CrossingVoid/Content/..."

; --------------------------------------------------------------------------
; 兜底 B：其它一切带 Content 的东西（引擎自带内容、插件内容）→ pakchunk0 基础包
;
; 没有这一条的话，这些「引擎依赖」会留在默认分配器给的 chunk 10 里，
; 变成玩家必须额外下载、却又不是我们素材的包。它们属于基础包。
; 注意顺序：必须在兜底 A 之后 —— 规则是「首个匹配生效」。
; --------------------------------------------------------------------------
[CC_BaseRest]
bOverrideChunkManifest=true
OverridePaks="pakchunk0"
bOnlyChunkedBuilds=true
+Files=".../Content/..."

