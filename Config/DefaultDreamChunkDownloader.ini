; 下载器设置。从 DefaultCrossingChunk.ini 迁移而来：
; 插件的设置类现在是 UDreamChunkDownloaderSettings（Config=DreamChunkDownloader），
; 所以节名从 [/Script/CrossingChunk.*] 改成 [/Script/DreamChunkDownloader.*]。
; 值原样保留：BuildID、下载分片、部署源。

[/Script/DreamChunkDownloader.DreamChunkDownloaderSettings]
; 总开关：默认关闭（2026-09-20）。关掉后不读清单、不联网、不下载/挂载分片，
; 服务端启动也不会再因为清单 404 反复退避重试（实测会把端口监听拖到 3 分钟后）。
; 要用热更时在 项目设置 → DREAM PLUGIN → 梦想分片下载器设置 里打开。
bEnableChunkDownloader=False
bUseStaticRemoteHost=False
StaticRemoteHost=sample.com/data/
+DownloadChunkIds=1
+DownloadChunkIds=2
+DownloadChunkIds=3
+DownloadChunkIds=4
+DownloadChunkIds=5
+DownloadChunkIds=6
+DownloadChunkIds=7
BuildID=V0.5.5
CacheFolderPath=Game
MaxConcurrentDownloads=1
+DeploymentSets=(DeploymentName="Windows",Hosts=("github.com/kirito0000001/crossing-void-packages/releases/download/","cdn.64hz.cn/crossing-void/packages/"))
+DeploymentSets=(DeploymentName="Android",Hosts=("cdn.64hz.cn/crossing-void/packages/"))
EmbeddedManifestFileName=EmbeddedManifest.json
LocalManifestFileName=LocalManifest.json
CachedBuildManifestFileName=CachedBuildManifest.json
